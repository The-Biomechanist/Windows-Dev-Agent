# Runtime capability catalog for Windows Dev Agent.
#
# Commands are argv vectors, never shell strings.  Safety is explicit so both
# the MCP server and Claude Code PreToolUse hook can enforce the same boundary.

inspect-git:
  description: Inspect the current Git working tree without mutating it.
  safety: read-only
  tags: [git, inspection]
  tools:
    - name: git
      argv: [git, status, --short, --branch]
      check_argv: [git, --version]

lint-python:
  description: Run an installed Python linter against the current project.
  safety: reversible
  tags: [python, lint]
  tools:
    - name: ruff
      argv: [ruff, check, .]
      check_argv: [ruff, --version]
      verify_argv: [ruff, check, .]
    - name: pylint
      argv: [pylint, .]
      check_argv: [pylint, --version]
      verify_argv: [pylint, .]

lint-javascript:
  description: Run an installed JavaScript or TypeScript linter against the current project.
  safety: reversible
  tags: [javascript, typescript, lint]
  tools:
    - name: eslint
      argv: [eslint, .]
      check_argv: [eslint, --version]
      verify_argv: [eslint, .]
    - name: dprint
      argv: [dprint, check]
      check_argv: [dprint, --version]
      verify_argv: [dprint, check]

test-python:
  description: Run the Python test suite with pytest.
  safety: reversible
  tags: [python, test]
  tools:
    - name: pytest
      argv: [pytest]
      check_argv: [pytest, --version]
      verify_argv: [pytest]

test-dotnet:
  description: Run the .NET test suite in the current project.
  safety: reversible
  tags: [dotnet, test]
  tools:
    - name: dotnet
      argv: [dotnet, test]
      check_argv: [dotnet, --version]
      verify_argv: [dotnet, test]

build-dotnet:
  description: Build the current .NET project using the native dotnet toolchain.
  safety: reversible
  tags: [dotnet, build]
  tools:
    - name: dotnet
      argv: [dotnet, build]
      check_argv: [dotnet, --version]
      verify_argv: [dotnet, build, --no-restore]

create-pr:
  description: Create a GitHub pull request from the current branch using the GitHub CLI.
  safety: approval-required
  tags: [git, github, publish]
  tools:
    - name: gh
      argv: [gh, pr, create, --fill]
      check_argv: [gh, --version]
