name: Materialize native application discovery

on:
  push:
    branches: [repair/0.5.0-native-application-discovery]

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate and apply exact transform
        shell: pwsh
        run: |
          python -m py_compile .github/apply_native_application_discovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/apply_native_application_discovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shape and compile
        shell: pwsh
        run: |
          git diff --check
          python -m compileall -q src
          @'
          from pathlib import Path
          ps = Path("src/discovery/discovery.ps1").read_text(encoding="utf-8")
          assert "Get-WdaApplicationSearchPath" in ps
          assert "Get-Command -Name $Name -CommandType Application" in ps
          assert "Get-Command $Name -ErrorAction SilentlyContinue" not in ps
          assert "[Environment]::CurrentDirectory" in ps
          assert "$env:PATH = $originalPath" in ps
          '@ | python -
      - name: Install development dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused discovery tests
        run: python -m pytest tests/test_discovery_windows.py tests/test_discovery.py -q
      - name: Run native discovery producer smoke
        shell: powershell
        run: |
          $raw = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./src/discovery/discovery.ps1
          if ($LASTEXITCODE -ne 0) { throw "discovery producer exited $LASTEXITCODE" }
          $snapshot = $raw | ConvertFrom-Json
          if ($snapshot.development_tools.git_available -ne $true) {
            throw "Git application was not discovered on the Windows runner"
          }
          if ($snapshot.runtimes.python.available -ne $true) {
            throw "Python application was not discovered on the Windows runner"
          }
          Write-Host "native Application discovery preserved real runner executables"
      - name: Run full tests
        run: python -m pytest tests -q
      - name: Remove staging machinery and commit verified repair
        shell: pwsh
        run: |
          $temporary = @(
            ".github/apply_native_application_discovery.py",
            ".github/workflows/probe-application-discovery.yml",
            ".github/workflows/materialize-application-discovery.yml"
          )
          git rm -f --ignore-unmatch -- $temporary
          git add -A
          git diff --cached --check
          $residue = @($temporary | Where-Object { Test-Path -LiteralPath $_ })
          if ($residue.Count -gt 0) {
            throw "temporary application-discovery machinery remains: $($residue -join ', ')"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use native PowerShell application discovery"
          git push origin HEAD:repair/0.5.0-native-application-discovery
