name: Probe native discovery contracts

on:
  push:
    branches: [repair/0.5.0-native-discovery-authority]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe Dev Drive and WSL authority surfaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $fsutil = Join-Path $env:SystemRoot 'System32\fsutil.exe'
          Write-Host "fsutil=$fsutil exists=$(Test-Path -LiteralPath $fsutil -PathType Leaf)"
          if (Test-Path -LiteralPath $fsutil -PathType Leaf) {
            & $fsutil devdrv query
            Write-Host "fsutil devdrv query rc=$LASTEXITCODE"
            & $fsutil devdrv query C:
            Write-Host "fsutil devdrv query C: rc=$LASTEXITCODE"
            foreach ($volume in @(Get-Volume -ErrorAction SilentlyContinue | Where-Object DriveLetter)) {
              $drive = "$($volume.DriveLetter):"
              & $fsutil devdrv query $drive *> $null
              Write-Host "fsutil devdrv query $drive rc=$LASTEXITCODE fs=$($volume.FileSystem) label=$($volume.FileSystemLabel)"
            }
          }

          try {
            $feature = Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux -ErrorAction Stop
            Write-Host "wsl optional feature state=$($feature.State)"
          } catch {
            Write-Host "wsl optional feature query error=$($_.Exception.Message)"
          }

          $wsl = Join-Path $env:SystemRoot 'System32\wsl.exe'
          Write-Host "wsl=$wsl exists=$(Test-Path -LiteralPath $wsl -PathType Leaf)"
          if (Test-Path -LiteralPath $wsl -PathType Leaf) {
            foreach ($args in @(@('--status'), @('--version'), @('--list','--quiet'))) {
              $psi = [System.Diagnostics.ProcessStartInfo]::new()
              $psi.FileName = $wsl
              $psi.UseShellExecute = $false
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              foreach ($arg in $args) { [void]$psi.ArgumentList.Add($arg) }
              $p = [System.Diagnostics.Process]::Start($psi)
              if (-not $p.WaitForExit(10000)) {
                try { $p.Kill() } catch {}
                Write-Host "wsl $($args -join ' ') timed_out=true"
                continue
              }
              $stdout = $p.StandardOutput.ReadToEnd().Trim() -replace "`r?`n", ' | '
              $stderr = $p.StandardError.ReadToEnd().Trim() -replace "`r?`n", ' | '
              Write-Host "wsl $($args -join ' ') rc=$($p.ExitCode) stdout=$stdout stderr=$stderr"
            }
          }

          try {
            $packages = @(Get-AppxPackage -Name MicrosoftCorporationII.WindowsSubsystemForLinux -ErrorAction Stop)
            Write-Host "store WSL package count=$($packages.Count)"
          } catch {
            Write-Host "store WSL package query error=$($_.Exception.Message)"
          }
