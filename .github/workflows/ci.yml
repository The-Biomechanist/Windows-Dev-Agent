name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile runtime
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest tests -q
      - name: MCP preflight
        shell: pwsh
        run: |
          @'
          import asyncio
          from src import __version__
          from src.claude_server import handle_request as claude_handle
          from src.codex_server import handle_request as codex_handle

          expected = [
              "env_inspect",
              "tool_discover",
              "capability_run",
              "workflow_plan",
              "package_search",
              "package_install",
              "sandbox_run",
              "ecosystem_scan",
              "logs_query",
              "mcp_audit",
          ]

          for host, handle in (("claude", claude_handle), ("codex", codex_handle)):
              init = asyncio.run(handle({"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}))
              assert init["result"]["serverInfo"] == {"name": "windows-dev-agent", "version": __version__}
              tools = asyncio.run(handle({"jsonrpc":"2.0","id":2,"method":"tools/list"}))
              names = [tool["name"] for tool in tools["result"]["tools"]]
              assert names == expected, (host, names)
              print(f"{host} MCP preflight OK:", ", ".join(names))
          '@ | python -
      - name: Release index identity
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          @'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          index_path = ".agents/plugins/marketplace.json"
          index = Path(index_path)
          if not index.exists():
              print("No marketplace index in immutable plugin payload; nothing to verify.")
              raise SystemExit(0)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          market = json.loads(index.read_text(encoding="utf-8"))
          source = market["plugins"][0]["source"]
          sha = source.get("sha", "")
          assert re.fullmatch(r"[0-9a-f]{40}", sha), source
          assert "ref" not in source and "path" not in source, source

          subprocess.check_call(["git", "merge-base", "--is-ancestor", sha, "HEAD"])
          pinned_manifest = json.loads(git("show", f"{sha}:.codex-plugin/plugin.json"))
          current_manifest = json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          assert pinned_manifest["name"] == current_manifest["name"] == "windows-dev-agent"
          assert pinned_manifest["version"] == current_manifest["version"]

          head = os.environ.get("PR_HEAD_SHA", "").strip()
          base = os.environ.get("PR_BASE_SHA", "").strip()
          if head and base:
              changed = [line for line in git("diff", "--name-only", f"{base}...{head}").splitlines() if line]

              def is_payload(path):
                  if path in {
                      "capabilities.yaml",
                      "requirements.txt",
                      "apm.yml",
                      ".mcp.json",
                      ".mcp.codex.json",
                  }:
                      return True
                  return path.startswith((
                      ".claude-plugin/",
                      ".codex-plugin/",
                      "src/",
                      "skills/",
                      "hooks/",
                      "commands/",
                      "agents/",
                  ))

              payload_changed = any(is_payload(path) for path in changed)
              index_changed = index_path in changed
              if payload_changed:
                  assert index_changed, "Executable/plugin payload changed without updating the marketplace pin"
                  expected_payload = git("rev-parse", f"{head}^")
                  assert sha == expected_payload, (
                      f"Marketplace pins {sha}, but the final marketplace-only commit must pin its exact parent payload {expected_payload}"
                  )
                  final_delta = [line for line in git("diff", "--name-only", expected_payload, head).splitlines() if line]
                  assert final_delta == [index_path], (
                      f"Final release-index commit must change only {index_path}; got {final_delta}"
                  )

          print(f"Marketplace pins verified immutable payload {sha} version {pinned_manifest['version']}")
          '@ | python -
