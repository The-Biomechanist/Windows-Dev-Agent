name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile runtime
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest tests -q
      - name: MCP preflight
        shell: pwsh
        run: |
          @'
          import asyncio
          from src import __version__
          from src.claude_server import handle_request as claude_handle
          from src.codex_server import handle_request as codex_handle

          expected = [
              "env_inspect",
              "tool_discover",
              "capability_run",
              "workflow_plan",
              "package_search",
              "package_install",
              "sandbox_run",
              "ecosystem_scan",
              "logs_query",
              "mcp_audit",
          ]

          for host, handle in (("claude", claude_handle), ("codex", codex_handle)):
              init = asyncio.run(handle({"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}))
              assert init["result"]["serverInfo"] == {"name": "windows-dev-agent", "version": __version__}
              tools = asyncio.run(handle({"jsonrpc":"2.0","id":2,"method":"tools/list"}))
              names = [tool["name"] for tool in tools["result"]["tools"]]
              assert names == expected, (host, names)
              print(f"{host} MCP preflight OK:", ", ".join(names))
          '@ | python -
      - name: Release index identity
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import re
          import subprocess

          index = Path(".agents/plugins/marketplace.json")
          if not index.exists():
              print("No marketplace index in immutable plugin payload; nothing to verify.")
              raise SystemExit(0)

          market = json.loads(index.read_text(encoding="utf-8"))
          source = market["plugins"][0]["source"]
          sha = source.get("sha", "")
          assert re.fullmatch(r"[0-9a-f]{40}", sha), source
          assert "ref" not in source and "path" not in source, source

          pinned_manifest = json.loads(
              subprocess.check_output(
                  ["git", "show", f"{sha}:.codex-plugin/plugin.json"],
                  text=True,
              )
          )
          current_manifest = json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          assert pinned_manifest["name"] == current_manifest["name"] == "windows-dev-agent"
          assert pinned_manifest["version"] == current_manifest["version"]

          payload_carries_index = subprocess.run(
              ["git", "cat-file", "-e", f"{sha}:.agents/plugins/marketplace.json"],
              capture_output=True,
              text=True,
          )
          assert payload_carries_index.returncode != 0, "immutable payload must not carry its own marketplace index"

          diff = subprocess.run(
              [
                  "git", "diff", "--exit-code", "--no-ext-diff",
                  sha, "HEAD", "--", ".", ":(exclude).agents/plugins/marketplace.json",
              ],
              capture_output=True,
              text=True,
          )
          assert diff.returncode == 0, (
              "marketplace payload differs from current release tree outside the index:\n"
              + diff.stdout + diff.stderr
          )
          print(f"Marketplace pins byte-identical payload {sha} version {pinned_manifest['version']}")
          '@ | python -
