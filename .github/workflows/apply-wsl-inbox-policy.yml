name: Apply WSL Inbox policy authority

on:
  push:
    branches: [repair/0.5.0-native-discovery-authority]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Apply exact policy transform
        shell: pwsh
        run: |
          python .github/apply_wsl_inbox_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shape and compile
        shell: pwsh
        run: |
          git diff --check
          python -m compileall -q src
          @'
          from pathlib import Path
          state = Path("src/windows_state.py").read_text(encoding="utf-8")
          discovery = Path("src/discovery/discovery.ps1").read_text(encoding="utf-8")
          assert "AllowInboxWSL" in state
          assert "WSL_STORE_SERVICE_KEY" in state
          assert "WSL_INBOX_SERVICE_KEY" in state
          assert "AllowInboxWSL" in discovery
          assert "$wslStoreServicePresent" in discovery
          assert "$wslInboxServicePresent" in discovery
          assert "$wslImplementationAllowed" in discovery
          '@ | python -
      - name: Install development dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused WSL and discovery tests
        run: python -m pytest tests/test_windows_state.py tests/test_discovery.py tests/test_discovery_windows.py tests/test_mcp_runtime.py -q
      - name: Exercise native WSL authority on runner
        shell: pwsh
        run: |
          @'
          from src.execution import resolve_windows_system_executable
          from src.windows_state import query_wsl_route_state

          state = query_wsl_route_state(resolve_windows_system_executable("wsl.exe"))
          print("native WSL route state:", state)
          assert state.available in {True, False, None}
          if state.available is True:
              assert state.default_distribution
          '@ | python -
      - name: Run Windows PowerShell discovery producer
        shell: powershell
        run: |
          $raw = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./src/discovery/discovery.ps1
          if ($LASTEXITCODE -ne 0) { throw "discovery producer exited $LASTEXITCODE" }
          $snapshot = $raw | ConvertFrom-Json
          if ($snapshot.virtualization.wsl_available -notin @($true, $false, $null)) {
            throw "invalid WSL availability state"
          }
          if (@($snapshot.virtualization.wsl_distros).Count -eq 0 -and $snapshot.virtualization.wsl_available -eq $true) {
            throw "WSL route cannot be available without a registered distribution"
          }
          Write-Host "WSL discovery policy contract OK"
      - name: Run full tests
        run: python -m pytest tests -q
      - name: Remove staging machinery and commit verified policy repair
        shell: pwsh
        run: |
          $temporary = @(
            ".github/apply_wsl_inbox_policy.py",
            ".github/workflows/apply-wsl-inbox-policy.yml"
          )
          git rm -f --ignore-unmatch -- $temporary
          git add -A
          git diff --cached --check
          $residue = @($temporary | Where-Object { Test-Path -LiteralPath $_ })
          if ($residue.Count -gt 0) {
            throw "temporary WSL policy machinery remains: $($residue -join ', ')"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: honor native WSL policy authority"
          git push origin HEAD:repair/0.5.0-native-discovery-authority
