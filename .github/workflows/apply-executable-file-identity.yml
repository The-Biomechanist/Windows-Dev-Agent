name: Apply executable file identity hardening

on:
  push:
    branches: [repair/0.5.0-executable-file-identity]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Apply exact source transforms
        run: python .github/apply_executable_file_identity.py
      - name: Remove temporary staging machinery
        shell: pwsh
        run: git rm .github/apply_executable_file_identity.py .github/workflows/apply-executable-file-identity.yml
      - name: Verify patch shape
        shell: pwsh
        run: |
          git diff --check
          git status --short
      - name: Install development dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Compile runtime
        run: python -m compileall -q src
      - name: Run focused regressions
        run: python -m pytest tests/test_execution.py tests/test_capabilities_runtime.py tests/test_mcp_runtime.py tests/test_authority_regressions.py -q
      - name: Run full tests
        run: python -m pytest tests -q
      - name: Commit verified repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind reviewed executable path and contents"
          git push origin HEAD:repair/0.5.0-executable-file-identity
