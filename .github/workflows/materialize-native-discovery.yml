name: Materialize native discovery authority

on:
  push:
    branches: [repair/0.5.0-native-discovery-authority]

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Apply native authority transforms
        shell: pwsh
        run: |
          python .github/apply_native_discovery_authority.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/apply_native_discovery_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source shape and compile
        shell: pwsh
        run: |
          git diff --check
          python -m compileall -q src
          @'
          from pathlib import Path
          ps = Path("src/discovery/discovery.ps1").read_text(encoding="utf-8")
          assert "\nelif (" not in ps
          assert "FSCTL_QUERY_PERSISTENT_VOLUME_STATE" in ps
          assert "PERSISTENT_VOLUME_STATE_DEV_VOLUME" in ps
          assert 'FileSystemLabel -match "DevDrive"' not in ps
          assert "MicrosoftCorporationII.WindowsSubsystemForLinux" in ps
          assert "wsl_available = $wslAvailable" in ps
          server = Path("src/mcp/server.py").read_text(encoding="utf-8")
          assert "query_wsl_route_state" in server
          '@ | python -
      - name: Install development dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused native authority tests
        run: python -m pytest tests/test_windows_state.py tests/test_discovery.py tests/test_discovery_windows.py tests/test_mcp_runtime.py -q
      - name: Exercise native Dev Drive query where applicable
        shell: powershell
        run: |
          $null = . ./src/discovery/discovery.ps1
          if (-not (Initialize-DevDriveNativeProbe)) {
            throw "native Dev Drive helper could not initialize"
          }
          $refsVolumes = @(Get-Volume -ErrorAction Stop | Where-Object {
            $_.FileSystemType -eq "ReFS" -and -not [string]::IsNullOrWhiteSpace([string]$_.Path)
          })
          if ($refsVolumes.Count -eq 0) {
            Write-Host "runner has no ReFS volume; native helper compiled and producer has no Dev Drive candidates"
          }
          foreach ($volume in $refsVolumes) {
            $isDevDrive = $false
            $nativeError = 0
            $established = [WdaNative.DevDriveProbe]::TryIsDeveloperVolume(
              [string]$volume.Path,
              [ref]$isDevDrive,
              [ref]$nativeError
            )
            if (-not $established) {
              throw "Dev Drive identity for $($volume.Path) was not established; Win32 error $nativeError"
            }
            Write-Host "ReFS $($volume.Path): developer_volume=$isDevDrive"
          }
      - name: Exercise native WSL route state
        shell: pwsh
        run: |
          @'
          from src.execution import resolve_windows_system_executable
          from src.windows_state import query_wsl_route_state

          executable = resolve_windows_system_executable("wsl.exe")
          state = query_wsl_route_state(executable)
          print("wsl route state:", state)
          assert state.available in {True, False, None}
          if state.available is True:
              assert state.default_distribution
          '@ | python -
      - name: Run native discovery producer smoke
        shell: powershell
        run: |
          $raw = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./src/discovery/discovery.ps1
          if ($LASTEXITCODE -ne 0) { throw "discovery producer exited $LASTEXITCODE" }
          $snapshot = $raw | ConvertFrom-Json
          if ($snapshot.virtualization.dev_drive_inventory_state -notin @("available", "unknown")) {
            throw "invalid Dev Drive inventory state"
          }
          if ($snapshot.virtualization.wsl_available -notin @($true, $false, $null)) {
            throw "invalid WSL availability state"
          }
          if (@($snapshot.virtualization.wsl_distros).Count -eq 0 -and $snapshot.virtualization.wsl_available -eq $true) {
            throw "WSL route cannot be available without a registered distribution"
          }
          Write-Host "native discovery contract OK"
      - name: Run full tests
        run: python -m pytest tests -q
      - name: Remove temporary probe machinery and commit materialized repair
        shell: pwsh
        run: |
          $temporary = @(
            ".github/apply_native_discovery_authority.py",
            ".github/apply_native_discovery_docs.py",
            ".github/workflows/probe-native-discovery.yml",
            ".github/workflows/materialize-native-discovery.yml"
          )
          git rm -f --ignore-unmatch -- $temporary
          git add -A
          git diff --cached --check
          $residue = @($temporary | Where-Object { Test-Path -LiteralPath $_ })
          if ($residue.Count -gt 0) {
            throw "temporary discovery machinery remains in resulting tree: $($residue -join ', ')"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use native Windows discovery authority"
          git push origin HEAD:repair/0.5.0-native-discovery-authority
