name: Probe Visual Studio locator authority

on:
  push:
    branches: [repair/0.5.0-native-visual-studio-discovery]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe fixed vswhere locator and installed instances
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          Write-Host "vswhere=$vswhere exists=$(Test-Path -LiteralPath $vswhere -PathType Leaf)"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'Hosted Windows image did not expose the Visual Studio Installer locator'
          }

          $instances = @(& $vswhere -prerelease -format json -utf8 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "vswhere exited $LASTEXITCODE" }
          Write-Host "default IDE instances=$($instances.Count)"
          foreach ($instance in $instances) {
            Write-Host "  product=$($instance.productId) complete=$($instance.isComplete) launchable=$($instance.isLaunchable) path=$($instance.installationPath)"
          }
          if ($instances.Count -eq 0) {
            throw 'Hosted Windows image unexpectedly has no complete/launchable Visual Studio IDE instance'
          }
          foreach ($instance in $instances) {
            if ($instance.productId -notmatch '^Microsoft\.VisualStudio\.Product\.(Community|Professional|Enterprise)$') {
              throw "default vswhere query returned non-IDE product $($instance.productId)"
            }
            if ($instance.isComplete -ne $true -or $instance.isLaunchable -ne $true) {
              throw "default vswhere query returned unusable instance $($instance.instanceId)"
            }
          }

          $allProducts = @(& $vswhere -prerelease -products '*' -format json -utf8 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "vswhere -products * exited $LASTEXITCODE" }
          Write-Host "all product instances=$($allProducts.Count)"
          foreach ($instance in $allProducts) {
            Write-Host "  all-product=$($instance.productId) path=$($instance.installationPath)"
          }

          $devenv = Get-Command -Name devenv -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "devenv-on-path=$($devenv.Source)"
